name: Check links

# Link rot is the main long-term threat to this site, so the collection gets
# checked on every change to the content and once a week regardless.
#
# The weekly run also writes link-status.md and commits it. That is deliberate.
# GitHub switches a scheduled workflow off after 60 days without repository
# activity, which is exactly what happened on 12 October 2026: the check
# stopped running and nothing said so. A weekly commit keeps the clock from
# ever reaching 60 days, and leaves a visible record of when the clips were
# last confirmed alive.
#
# link-status.md is deliberately absent from the push paths below, so the
# commit this workflow makes cannot trigger another run of it.

on:
  push:
    paths:
      - entries.js
      - tools/check-links.mjs
      - .github/workflows/check-links.yml
  pull_request:
    paths:
      - entries.js
      - tools/check-links.mjs
      - .github/workflows/check-links.yml
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check entries and clips
        id: check
        run: |
          set +e
          node tools/check-links.mjs > result.txt 2>&1
          code=$?
          set -e

          cat result.txt
          {
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Runs even when the check failed, because a run that found dead clips is
      # the one most worth recording.
      - name: Record the result
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          {
            echo "# Link status"
            echo
            echo "Checked $(date -u '+%Y-%m-%d %H:%M UTC') by the Check links workflow."
            echo
            echo '```'
            cat result.txt
            echo '```'
          } > link-status.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add link-status.md
          git commit -m "Record link check for $(date -u '+%Y-%m-%d')" || exit 0
          git push

      - name: Fail if the collection is broken
        run: |
          code="${{ steps.check.outputs.code }}"
          # 2 means YouTube could not be reached, so liveness is simply unknown.
          # That is not a broken collection and should not show up as one.
          if [ "$code" -eq 2 ]; then
            echo "::warning::Could not reach YouTube, so clip liveness went unchecked on this run."
            exit 0
          fi
          exit "$code"
