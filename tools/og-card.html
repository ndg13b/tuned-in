<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tuned In — social preview card</title>
<!--
  The source of og-card.png, kept as a plain page so it can be reopened and
  re-shot without a build step. Render it at exactly 1200x630 and save the
  result as og-card.png in the repository root.

  Deliberately carries no counts. A card that says "24 clips" is wrong the
  week after a clip is added, and nothing would prompt anyone to notice.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#DCDDD8; --surface:#F7F7F4; --slate:#20263A;
    --ink:#191F33; --ink-soft:#5A6076; --rule:#C2C4BC;
    --blue:#3F4E9E; --gold:#8F680E; --rose:#A8455F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px}
  body{
    background:var(--ground); color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:72px 80px; position:relative; overflow:hidden;
  }
  /* A wash of the verdict colours, the one piece of the design system that
     carries meaning rather than decoration. */
  .edge{position:absolute;left:0;top:0;bottom:0;width:14px;
        background:linear-gradient(180deg,var(--blue) 0 33.3%,var(--gold) 33.3% 66.6%,var(--rose) 66.6% 100%)}

  .top{display:flex;align-items:center;gap:22px}
  .mark{width:66px;height:66px;flex:none}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.2em;
          text-transform:uppercase;color:var(--ink-soft)}

  h1{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:132px;line-height:.92;
     letter-spacing:-.03em;font-variation-settings:'SOFT' 40,'WONK' 1}
  .tagline{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:400;
           font-size:42px;color:var(--blue);margin-top:16px;letter-spacing:-.01em}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:30px;
        border-top:1px solid var(--rule);padding-top:26px}
  .line{font-size:25px;color:#2C3348;max-width:720px}
  .verdicts{display:flex;gap:10px;flex:none}
  .v{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.1em;
     text-transform:uppercase;color:#fff;border-radius:999px;padding:9px 17px}
  .v.a{background:var(--blue)} .v.b{background:var(--gold)} .v.c{background:var(--rose)}
</style>
</head>
<body>
  <div class="edge"></div>

  <div class="top">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="4.2" width="28" height="20.6" rx="3.4" fill="#F4F1E9" stroke="#20263A" stroke-width="2.2"/>
      <path d="M15.9 8.9c-2.2 0-3.6.8-4.1 1.9-1.6.1-2.6 1-2.6 2.1 0 .6.3 1.1.8 1.5-.4.4-.6.9-.6 1.4 0 1.5 1.6 2.6 3.9 2.6.9 0 1.8-.2 2.6-.6.8.4 1.7.6 2.6.6 2.3 0 3.9-1.1 3.9-2.6 0-.5-.2-1-.6-1.4.5-.4.8-.9.8-1.5 0-1.1-1-2-2.6-2.1-.5-1.1-1.9-1.9-4.1-1.9z" fill="#3F4E9E"/>
      <g fill="none" stroke="#F4F1E9" stroke-width="1.35" stroke-linecap="round">
        <path d="M16 10.4v7.4"/><path d="M13.4 12.1c-1.3.3-1.9 1-1.9 1.9"/><path d="M18.7 12.1c1.3.3 1.9 1 1.9 1.9"/>
      </g>
      <g stroke="#20263A" stroke-width="2.4" stroke-linecap="round">
        <path d="M16 24.8v3.2"/><path d="M10.8 28.4h10.4"/>
      </g>
    </svg>
    <p class="kicker">A teaching collection &middot; cognitive psychology</p>
  </div>

  <div>
    <h1>Tuned In</h1>
    <p class="tagline">pop culture, and the psychology underneath it</p>
  </div>

  <div class="foot">
    <p class="line">Watch the clip. Then read what is actually going on in it.</p>
    <div class="verdicts">
      <span class="v a">Real</span>
      <span class="v b">Exaggerated</span>
      <span class="v c">Myth</span>
    </div>
  </div>
</body>
</html>
