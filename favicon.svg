<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tuned In">
  <!--
    A set with a mind in it.
    Two constraints drove the shape. The screen is filled light and outlined
    dark so it survives on both light and dark browser chrome, and the brain is
    a solid asymmetric blob rather than two symmetric lobes, because symmetry
    around a centre line reads as the letter phi at 16px.
  -->
  <rect x="2" y="4.2" width="28" height="20.6" rx="3.4" fill="#F4F1E9" stroke="#20263A" stroke-width="2.2"/>
  <path d="M15.9 8.9c-2.2 0-3.6.8-4.1 1.9-1.6.1-2.6 1-2.6 2.1 0 .6.3 1.1.8 1.5-.4.4-.6.9-.6 1.4 0 1.5 1.6 2.6 3.9 2.6.9 0 1.8-.2 2.6-.6.8.4 1.7.6 2.6.6 2.3 0 3.9-1.1 3.9-2.6 0-.5-.2-1-.6-1.4.5-.4.8-.9.8-1.5 0-1.1-1-2-2.6-2.1-.5-1.1-1.9-1.9-4.1-1.9z" fill="#3F4E9E"/>
  <g fill="none" stroke="#F4F1E9" stroke-width="1.35" stroke-linecap="round">
    <path d="M16 10.4v7.4"/>
    <path d="M13.4 12.1c-1.3.3-1.9 1-1.9 1.9"/>
    <path d="M18.7 12.1c1.3.3 1.9 1 1.9 1.9"/>
  </g>
  <g stroke="#20263A" stroke-width="2.4" stroke-linecap="round">
    <path d="M16 24.8v3.2"/>
    <path d="M10.8 28.4h10.4"/>
  </g>
</svg>
